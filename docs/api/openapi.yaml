          type: array
          description: >
            ⚠ 대화 중 바로 고쳐 주는 규칙. 지금 앱 타입은 LiveFix = [RegExp, (v) => string, 이유] —
            JS 정규식 객체와 함수라 JSON 으로 못 보내요

            (data/lesson34-lv3.ts LIVE: be동사 + agree · be동사 + 상태동사 -ing · 빈도부사 + -ing · '요즘' 현재진행형. 고치기 함수가 주어 표(SUBJ) · unIng · 3인칭 s 를 계산해요).

            제안: ① 진짜 교정은 /ai/feedback kind=fix 로 서버가 하고, ② 오프라인 대체용으로만 아래 JSON 규칙(LiveFixRule)을 보내요.

            replace 는 정규식 치환 문자열($1 · $2)로만 표현되는 규칙만 담을 수 있어서, 함수가 필요한 2 · 3번 규칙은 서버(AI) 쪽으로 옮겨야 해요.
          items:
            $ref: "#/components/schemas/LiveFixRule"
