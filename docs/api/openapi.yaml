        blockedAt:
          type: string
          format: date-time
    BlockedMemberPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/BlockedMember"
            total:
              type: integer
              description: 설정 '차단한 멤버 n명'
    MyReport:
      type: object
      required:
        - id
        - targetKind
        - targetLabel
        - reason
        - reportedAt
        - status
      properties:
        id:
          type: string
        targetKind:
          type: string
          enum:
            - post
            - comment
            - member
            - chat
          description: 글 · 댓글 · 멤버 · 채팅
        targetLabel:
          type: string
          description: 대상 이름 (익명 글이면 '익명 회원')
          example: Jay
        reason:
          type: string
          example: 불쾌하거나 무례한 말
        reportedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - received
            - resolved
          description: 접수 · 처리 완료
        result:
          type:
            - string
            - "null"
          description: 처리 결과 한 줄
          example: 경고를 보냈어요
    MyReportPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/MyReport"
            total:
              type: integer
    MyWarning:
      type: object
      required:
        - id
        - reason
        - issuedAt
      properties:
        id:
          type: string
        reason:
          type: string
        detail:
          type:
            - string
            - "null"
          description: 어떤 글 · 댓글 때문인지
        issuedAt:
          type: string
          format: date-time
        appealable:
          type: boolean
          description: 이의 신청 가능 (화면 자리만 있음)
    FaqItem:
      type: object
      required:
        - id
        - category
        - question
        - answer
      properties:
        id:
          type: string
        category:
          type: string
          enum:
            - 수업 · 예약
            - 이용권 · 결제
            - 레벨 · 교재
            - 라운지
            - 계정
        question:
          type: string
        answer:
          type: string
    SupportInquiryType:
      type: string
      description: 수업 · 예약 · 결제 · 환불 · 앱 오류 · 기타 (data/account.ts ASK_TYPES)
      enum:
        - class
        - payment
        - app_error
        - other
    SupportInquiry:
      type: object
      required:
        - id
        - type
        - content
        - status
        - createdAt
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/SupportInquiryType"
        content:
          type: string
        status:
          type: string
          enum:
            - waiting
            - answered
          description: 답변 대기 · 답변 완료
        answer:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        answeredAt:
          type:
            - string
            - "null"
          format: date-time
    SupportInquiryPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/SupportInquiry"
    ConsentSummary:
      type: object
      description: 백엔드 PublicConsentSummaryResponse {code, title} + (추가) version ·
        effectiveFrom
      required:
        - code
        - title
      properties:
        code:
          type: string
          example: SERVICE_TERMS
        title:
          type: string
          example: 서비스 이용약관
        version:
          type: integer
          description: (추가)
        effectiveFrom:
          type: string
          format: date
          description: (추가) 시행일
    AppVersionInfo:
      type: object
      required:
        - platform
        - latestVersion
        - minVersion
        - forceUpdate
      properties:
        platform:
          type: string
          enum:
            - ios
            - android
        latestVersion:
          type: string
          example: 1.0.0
        minVersion:
          type: string
          description: 이보다 낮으면 강제 업데이트
          example: 1.0.0
        forceUpdate:
          type: boolean
        storeUrl:
          type:
            - string
            - "null"
          format: uri
        releaseNotes:
          type: array
          description: 새 기능 (최신 순)
          items:
            type: object
            required:
              - version
              - text
            properties:
              version:
                type: string
              text:
                type: string
    PublicConsentDocument:
      type: object
      description: 백엔드 PublicConsentDocumentResponse 그대로
      required:
        - code
        - title
        - body
        - version
        - effectiveFrom
      properties:
        code:
          type: string
        title:
          type: string
        body:
          type: string
        version:
          type: integer
          example: 3
        effectiveFrom:
          type: string
          format: date
          example: 2026-09-01
  responses:
    NoContent:
      description: 성공 (본문 없음)
    BadRequest:
      description: 잘못된 요청 (invalid_request 등)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 로그인이 필요하거나 토큰 만료 → 앱은 /auth/refresh 한 번 후 다시 시도
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 권한 없음 (forbidden)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 없음 (entity_not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 상태 충돌 · 중복 · 마감 (duplicate_resource · illegal_operation ·
        concurrent_modification)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
