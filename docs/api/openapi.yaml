          example: "14"
        myVerifiedCount:
          type:
            - integer
            - "null"
          description: (추가) 내 인증 수 — 참여 중일 때만 (카드 막대 · 5/14일째)
          example: "5"
        memberPreview:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/MemberSummary"
          description: (추가) 카드 프사 3명 (+N 은 participantCount 로)
        likeCount:
          type: integer
          description: (추가) 좋아요 수 — 핫 점수에 써요
          example: "18"
        entryCount:
          type:
            - integer
            - "null"
          description: (추가) 표현 챌린지 문장 수 (문장 N)
          example: "4"
        entryPreview:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/ThreadComment"
          description: (추가) 표현 카드 문장 미리보기
        expression:
          oneOf:
            - $ref: "#/components/schemas/ChallengeExpression"
            - type: "null"
          description: (추가) 표현 챌린지만
        viewerSaved:
          type: boolean
          description: (추가) 내가 찜했는지
    ChallengeHome:
      type: object
      description: 챌린지 탭 한 번에 (백엔드 MobileGroupListResponse + hot)
      required:
        - hot
        - joined
        - recommended
      properties:
        hot:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ChallengeSummary"
          description: (추가) 지금 핫한 챌린지 TOP 3
        joined:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeSummary"
          description: 참여 중 (내가 연 것 맨 앞)
        recommended:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeSummary"
          description: 참여 안 한 것 (진행 중 + 곧 시작)
    ChallengeMyProgress:
      type: object
      description: 내 진행 (정식 참여자만, 백엔드 MobileChallengeMyProgressResponse)
      required:
        - verifiedDays
        - totalDays
        - streak
        - dayNumber
        - verifiedToday
      properties:
        verifiedDays:
          type: integer
          description: 내 인증 수
          example: "5"
        totalDays:
          type: integer
          example: "14"
        streak:
          type: integer
          description: 오늘 기준 연속 인증일
          example: "3"
        dayNumber:
          type: integer
          description: 오늘이 며칠째
          example: "6"
        verifiedToday:
          type: boolean
    ChallengeDetail:
      allOf:
        - $ref: "#/components/schemas/ChallengeSummary"
