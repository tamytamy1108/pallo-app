              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
      x-domain: lounge
  "/trips/{tripId}/close":
    post:
      tags:
        - 여행 · 해외살이
      operationId: closeTrip
      summary: 동행 모집 닫기 (올린 사람)
      description: "화면: trip.tsx TripCard 내 동행 [모집 닫기] [되돌리기]"
      x-status: new
      x-inventory: "#71"
      x-screens:
        - components/lounge/trip.tsx
      x-app-code: lounge-store.ts closeTrip(id, true)
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-domain: lounge
    delete:
      tags:
        - 여행 · 해외살이
      operationId: reopenTrip
      summary: 동행 모집 닫기 되돌리기
      description: "화면: trip.tsx 토스트 [되돌리기]"
      x-status: new
      x-inventory: "#71"
      x-screens:
        - components/lounge/trip.tsx
      x-app-code: lounge-store.ts closeTrip(id, false)
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-domain: lounge
  "/uploads/images/{purpose}":
    post:
      tags:
        - 공통 · 설정값
      operationId: uploadImage
      summary: 이미지 올리기 (모든 화면 공용)
      description: >
        화면: 프로필 사진 · 글/동아리/챌린지/행아웃 사진 (각 도메인)

        규칙: multipart file 하나. 받은 path(와 renditions)를 다른 API 본문에 넣어요. purpose 가 이미지 종류가 아니면 400.
      x-status: existing
      x-backend: MobileImageUploadController POST /uploads/images/{purpose}
        (UploadedAssetResponse)
      x-screens: []
      x-app-code: 없음
      parameters:
        - name: purpose
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ImageUploadPurpose"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedAsset"
        "400":
          $ref: "#/components/responses/BadRequest"
      x-domain: core
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 모바일 앱 access 토큰 (jwt.mobile, 15분). 만료되면 POST /auth/refresh
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: 이전 응답의 nextCursor 그대로. 처음엔 비움
      schema:
        type: string
    Size:
      name: size
      in: query
      required: false
      description: 한 번에 받을 개수
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 50
    Page:
      name: page
      in: query
      required: false
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        default: 0
        minimum: 0
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
    LearnLessonId:
      name: lessonId
      in: path
      required: true
      description: 과 id — 교재 '레벨-과' (1-1 · 3-101) 또는 상황 장면 id (travel-1)
      schema:
        type: string
        example: 1-1
    LearnStepId:
      name: stepId
      in: path
      required: true
      description: 단계 id (StudyStepId)
      schema:
        $ref: "#/components/schemas/StudyStepId"
    LoungeBranchCodes:
      name: branchCodes
      in: query
      required: false
      description: 지점 선택 시트에서 고른 지점 code 들(쉼표). 비우면 전체 지점. '전 지점' 행사 · 글은 늘 포함
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          example: hanam
    PageOneBased:
      name: page
      in: query
      required: false
      description: 1부터 시작하는 페이지 (백엔드 hangout · club 목록 규약)
      schema:
        type: integer
        default: 1
        minimum: 1
    CommentPage:
      name: page
      in: query
      required: false
      description: 최상위 댓글 페이지, 1부터 (공통 댓글 모듈)
      schema:
        type: integer
        default: 1
        minimum: 1
    CommentSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 10
    CommunityPostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1024
    StoryId:
      name: storyId
      in: path
      required: true
      schema:
        type: string
        example: st_01J9ZK
    HangoutId:
      name: id
      in: path
      required: true
      description: 번개(hangout) id
      schema:
        type: string
        format: uuid
    ClubId:
      name: id
      in: path
      required: true
      description: 동아리 id
      schema:
        type: string
        format: uuid
    ClubBoardPostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 77
    ClubMeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 15
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        example: tr_01J9ZK
    MemberCodePath:
      name: code
      in: path
      required: true
      description: 회원 코드 (my.yaml /members/{code} 와 같은 이름)
      schema:
        type: string
        example: M8F2K1
    MemberCode:
      name: memberCode
      in: path
      required: true
      description: 회원 코드 (MobileUser.code)
      schema:
        type: string
        example: M8F2K1
    ChallengePage1:
      name: page
      in: query
      required: false
      description: 1부터 시작하는 페이지 (백엔드 챌린지 · 댓글 모듈 규칙)
      schema:
        type: integer
        default: 1
        minimum: 1
    ChallengePostId:
      name: postId
      in: path
      required: true
      description: 인증 게시물 id (Long)
      schema:
        type: integer
        format: int64
        example: "1024"
    ChallengeCommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: "88"
    ChallengeEntryId:
      name: entryId
      in: path
      required: true
      description: 문장 · 답글 id (댓글 id)
      schema:
        type: string
        example: "3051"
  schemas:
    Error:
      type: object
      description: 모든 오류 응답 (GlobalExceptionHandler). message 는 화면에 그대로 띄울 수 있는 한국어로 부탁해요
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 오류 코드 (snake_case). 앱은 이 값으로만 분기
          example: invalid_request
        message:
          type: string
          description: 화면에 띄울 한국어 한 줄
          example: 잠시 후 다시 시도해 주세요
    CursorPage:
      type: object
      description: 무한 스크롤 목록 공통 모양 (새 API). nextCursor 가 null 이면 끝
      required:
        - rows
        - nextCursor
      properties:
        rows:
          type: array
          items: {}
        nextCursor:
          type:
            - string
            - "null"
          example: eyJpZCI6IjEyMyJ9
    Lang:
      type: string
      description: 학습 언어 (영어 · 일본어 · 중국어 · 스페인어)
      enum:
        - en
        - ja
        - zh
        - es
      example: en
    MemberSummary:
      type: object
      description: 글 · 댓글 · 참여자 목록 등에 나오는 회원 한 명
      required:
        - code
        - nickname
      properties:
        code:
          type: string
          description: 회원 코드 (MobileUser.code)
          example: M8F2K1
        nickname:
          type: string
          example: Tammy
        avatarUrl:
          type:
            - string
            - "null"
          format: uri
          description: 캐릭터 그림 (없으면 앱 기본)
        branchName:
          type:
            - string
            - "null"
          example: 하남점
    ImageRef:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        width:
          type: integer
        height:
          type: integer
    Place:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: 스타필드 하남 1층
        address:
          type: string
          example: 경기 하남시 미사대로 750
        detail:
          type: string
          description: 상세 위치 · 찾아오는 길
        lat:
          type: number
        lng:
          type: number
        region:
          type: string
          description: 지도 지역 (서울 · 경기 · 천안 · 대전 · 대구 · 울산 · 부산)
          example: 경기
    BranchRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: br-hanam
        name:
          type: string
          example: 하남점
    LoginProvider:
      type: string
      description: 소셜 로그인 제공자 (apple · google 은 백엔드 추가 필요)
      enum:
        - kakao
        - apple
        - google
      example: kakao
    AuthLoginRequest:
      type: object
      required:
        - authCode
      properties:
        provider:
          $ref: "#/components/schemas/LoginProvider"
        authCode:
          type: string
          description: 제공자가 준 값 (카카오 인가 코드 · Apple identityToken · Google idToken)
          example: q1w2e3...
        branchCode:
          type:
            - string
            - "null"
          maxLength: 20
          description: 지점 QR(카카오싱크 state)로 들어왔을 때만
          example: hanam
        adId:
          type:
            - integer
            - "null"
          format: int64
          description: 지점 마케팅 id (지점 QR 유입일 때만)
    AuthLoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        isNewMember:
          type: boolean
          description: (추가) 가입 단계를 아직 안 끝냄(onboardedAt 없음) → 앱은 약관 동의로. GET /me
            needsOnboarding 과 같은 값
        inquiryBranchCode:
          type:
            - string
            - "null"
          description: 지점 QR 상담 신청이 접수됐으면 그 지점 코드
        inquiryBranchName:
          type:
            - string
            - "null"
          description: 있으면 앱은 접수 확인 화면으로 (앱에 아직 없음)
          example: 하남점
        inquiryCandidateId:
          type:
            - string
            - "null"
          format: uuid
          description: POST /qr-inquiries/{candidateId}/preference 에 씀
    AuthTokenPair:
      type: object
      description: 토큰 두 개. 온보딩 필요 여부는 GET /me 에서
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: 15분
        refreshToken:
          type: string
    AuthRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    AuthEmailLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthSignupRequest:
      type: object
      required:
        - email
        - password
        - name
        - phone
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: 영문 + 숫자 섞기
        name:
          type: string
          maxLength: 20
        phone:
          type: string
          description: 010~019, 하이픈 있어도 됨
          example: 010-1234-5678
        ageGroup:
          type:
            - string
            - "null"
          description: 연령대 마스터데이터 code (/auth/signup/options)
        gender:
          type:
            - string
            - "null"
          enum:
            - FEMALE
            - MALE
            - null
    AuthSignupOptions:
      type: object
      required:
        - ageGroups
      properties:
        ageGroups:
          type: array
          items:
            $ref: "#/components/schemas/MasterDataOption"
    PhoneCodeRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          description: 숫자만
          example: "01012345678"
    PhoneCodeResponse:
      type: object
      required:
        - seconds
      properties:
        seconds:
          type: integer
          description: 몇 초 안에 넣어야 하는지
          example: 180
    PhoneVerifyRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
          example: "01012345678"
        code:
          type: string
          pattern: ^\d{6}$
          example: "123456"
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: 이 기기 refresh 토큰 (무효로 만들 것)
        pushToken:
          type: string
          description: 같이 지울 이 기기 푸시 토큰
    Me:
      type: object
      description: 나. code · host · needsOnboarding · memberAccessLevel 은 지금 있음, 나머지는 추가 필요
      required:
        - code
        - host
        - needsOnboarding
        - memberAccessLevel
      properties:
        code:
          type: string
          description: 회원 코드 (앱 Me.id)
          example: M8F2K1
        host:
          type: boolean
          description: 호스트 인증 여부
        needsOnboarding:
          type: boolean
          description: 가입 단계 필요 (지금은 닉네임 미설정 → onboardedAt 없음으로 바꿔 주세요)
        memberAccessLevel:
          type: string
          description: ACTIVE_MEMBER 열람/작성 · INACTIVE_MEMBER 열람만 · UNREGISTERED 제목만
          enum:
            - ACTIVE_MEMBER
            - INACTIVE_MEMBER
            - UNREGISTERED
          example: ACTIVE_MEMBER
        nickname:
          type:
            - string
            - "null"
          description: (추가) 홈 인사 Hey {nickname} · 앱 Me.name
          example: Tammy
        role:
          type: string
          description: (추가) guest 비회원 권한(지점 연동 전 · 연동 대기 · 못 찾음 · 체험 예약 · 앱 구경 모두) ·
            member 회원 · leader 리더(STAFF 멤버십) · manager 지점 매니저
          enum:
            - guest
            - member
            - leader
            - manager
          example: member
        linkStatus:
          type: string
          description: (추가) 가장 최근 지점 연동 요청 상태. none 요청 안 함 · pending 지점 확인 중(홈 잠긴 라벤더 카드 ·
            마이 ● 연동 확인 중) · linked 연동됨(마이 ✓ 연동됨) · rejected 못 찾음(홈 다시 요청하기 ·
            /link-rejected)
          enum:
            - none
            - pending
            - linked
            - rejected
          example: pending
        linkRequestId:
          type:
            - string
            - "null"
          format: uuid
          description: (추가) 그 연동 요청 id (GET /me/branch-link-requests 의 행)
        trialBooking:
          description: (추가) 이 계정으로 한 체험 예약 (다가오는 것 · 지난 뒤 7일까지). 홈 체험 카드 D-n · 당일 · 체험은
            어땠어요? 와 예약 내용 시트
          oneOf:
            - $ref: "#/components/schemas/MyTrialBooking"
            - type: "null"
        plan:
          type: string
          description: (추가) study 스터디 회원(홈에 출석 카드) · app 앱 구독자(홈에 오늘의 목표)
          enum:
            - study
            - app
          example: study
        primaryBranch:
          description: (추가) 대표 지점 · 앱 Me.branch
          oneOf:
            - $ref: "#/components/schemas/BranchRef"
            - type: "null"
        branches:
          type: array
          description: (추가) 활성 멤버십 지점 (최대 2)
          items:
            $ref: "#/components/schemas/BranchRef"
        studyLang:
          $ref: "#/components/schemas/Lang"
        levels:
          type: array
          description: (추가) 지금 듣는 레벨 · 두 레벨 병행이면 두 개 (앱 Me.lvs · Me.level 은 첫 값)
          items:
            type: integer
            minimum: 1
            maximum: 4
          example:
            - 1
            - 2
    ConsentDocument:
      type: object
      required:
        - versionId
        - code
        - title
        - body
        - required
        - version
        - effectiveFrom
        - sortOrder
      properties:
        versionId:
          type: string
          format: uuid
          description: 동의 제출 때 그대로 돌려보냄
        code:
          type: string
          example: APP_TERMS
        title:
          type: string
        body:
          type: string
        required:
          type: boolean
        version:
          type: integer
        effectiveFrom:
          type: string
          format: date
        sortOrder:
          type: integer
    ConsentAnswer:
      type: object
      required:
        - versionId
        - agreed
      properties:
        versionId:
          type: string
          format: uuid
        agreed:
          type: boolean
          description: 거부도 기록
    ConsentSubmitRequest:
      type: object
      required:
        - consents
      properties:
        consents:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/ConsentAnswer"
    PublicBranch:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          example: hanam
        name:
          type: string
          example: 하남점
        address:
          type:
            - string
            - "null"
          description: 위치 한 줄 (앱은 가까운 역까지 보여요 — 주소에 넣거나 필드 추가)
          example: 서울 영등포구 · 영등포역 3번 출구 2분
        region:
          type: string
          enum:
            - 서울
            - 경기
            - 충청
            - 경상
          description: (추가) 지점 목록 시트 권역 칩
          example: 경기
        phone:
          type:
            - string
            - "null"
          description: (추가) 지점 대표 전화 — [지점에 전화하기]
          example: 031-790-1234
    MyTrialBooking:
      type: object
      description: (추가 · GET /me trialBooking) 앱 state/me.ts Me.trial + 예약 내용
        시트(components/common/trial-booking.tsx) 칸
      required:
        - id
        - branchCode
        - branchName
        - date
        - time
        - lang
      properties:
        id:
          type: string
          format: uuid
          description: 지원자(Candidate) id
        branchCode:
          type: string
          example: hanam
        branchName:
          type: string
          example: 하남점
        branchPhone:
          type:
            - string
            - "null"
          example: 031-790-1234
        date:
          type: string
          format: date
          description: KST 상담 날짜
          example: 2026-11-28
        time:
          type: string
          description: KST HH:mm
          example: 15:00
        lang:
          $ref: "#/components/schemas/Lang"
        name:
          type: string
          description: 예약자 이름
          example: 김서현
        phone:
          type: string
          example: 010-1234-5678
        reasons:
          type: array
          items:
            type: string
        note:
          type:
            - string
            - "null"
          maxLength: 200
          description: 전달 사항
    TrialInquiryOptions:
      type: object
      required:
        - learningLanguages
        - joinPaths
      properties:
        learningLanguages:
          type: array
          items:
            $ref: "#/components/schemas/MasterDataOption"
        joinPaths:
          type: array
