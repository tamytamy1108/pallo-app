      type: string
      description: 서버가 오늘 기준으로 계산 (UPCOMING = 곧 시작 · ONGOING = 진행 중 · ENDED = 끝)
      enum:
        - UPCOMING
        - ONGOING
        - ENDED
      example: ONGOING
