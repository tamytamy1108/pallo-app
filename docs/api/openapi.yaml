openapi: 3.1.0
info:
  title: Pallo 앱 API (화면 기준)
  version: 0.1.0-draft
  description: >
    Pallo 모바일 앱(`mobile/`) **모든 화면에서 서버가 필요한 곳**을 화면 코드에서 하나씩 찾아 모은 문서예요.

    지금 앱은 전부 가짜 데이터(mock)로 돌아가요. 이 문서대로 서버가 생기면 앱은 설정 한 줄로 진짜 서버에 붙어요.


    ### 상태 표시 (`x-status`)

    | 값 | 뜻 | 서버가 할 일 |

    |---|---|---|

    | `existing` | 백엔드(secret `backend/…/api/app`)에 **이미 있는** API를 그대로 써요 | 없음. 앱이 이 모양에 맞춰요 |

    | `change` | 있는 API를 쓰되 **필드 · 동작이 더 필요**해요 | `x-gap` 에 적은 것만 추가 · 수정 |

    | `new` | 아직 없어요. 경로 · 모양은 **제안**이에요 | 만들어 주세요 (이름은 바꿔도 돼요. 바꾸면 이 문서를 고쳐 주세요) |


    각 API에는 `x-screens`(쓰는 화면 파일) · `x-app-code`(지금 가짜 데이터가 있는 곳) · `x-inventory`(예전 목록 `docs/appendix/api-inventory.md` 번호 · `docs/frontend/api-additions.md` A번호)가 붙어 있어요.

    화면별로 보려면 같은 폴더의 `screens.md` 를 봐요.


    ### 공통 약속 (지금 백엔드 방식에 맞췄어요)

    - 주소: 모바일 앱 컨트롤러는 `/app/api/v1` 아래 (`ApiPathPrefixConfig.APP_PREFIX`)

    - 인증: `Authorization: Bearer <access>` (jwt.mobile, access 15분 · refresh 30일). `security: []` 인 것만 로그인 없이

    - 오류: `{ "error": "snake_case_code", "message": "화면에 띄울 한국어" }` (`GlobalExceptionHandler`). 앱은 `error` 로만 갈라요

    - 목록: 새로 만드는 무한 스크롤 목록은 `?cursor=&size=` → `{ rows, nextCursor }`. 이미 있는 API는 지금 모양 그대로 (`PageResponse {rows,totalCount}` · `PostFeedResponse {posts,hasNext,nextCursor}` 등)

    - 시간: UTC ISO 8601 (`2026-11-24T10:30:00Z`), 날짜만이면 `2026-11-24`. 화면 표시는 앱이 기기 시간대로

    - 사진: 먼저 `POST /uploads/images/{purpose}` 로 올리고 받은 주소를 다른 API에 넣어요

    - 포인트 · 순위 · 연속 학습 · 정원 · 자격 같은 **계산은 서버가** 해요. 지금은 앱이 기기에서 흉내 내고 있어서, 규칙은 각 API 설명에 적어 뒀어요
servers:
  - url: http://localhost:8080/app/api/v1
    description: 로컬 백엔드
  - url: "{origin}/app/api/v1"
    description: dev · stg · prod (주소는 정해지면 채워요)
    variables:
      origin:
        default: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: 인증 · 시작
    description: >
      화면 app/welcome.tsx (첫 화면 · 카카오로 시작하기 하나) · app/login/index.tsx (→ /welcome
      으로 보내기만) · app/login/phone.tsx · app/trial/index.tsx (앱 안 체험 예약 한 장) ·
      app/_layout.tsx (부팅 · 토큰).

      가입 단계(약관 → 닉네임 → 캐릭터 → 지점 회원?) 화면은 '가입 · 온보딩' 태그에 있어요. 약관 · 체험 API 는 여기 것을 같이 써요.

      백엔드는 외부 authCode 로그인(POST /auth/login) + 이메일 가입/로그인을 이미 가지고 있어요. 앱의 Apple · Google · 휴대폰 로그인은 아직 없음(x-gap).
  - name: 홈
    description: >
      화면 app/(tabs)/index.tsx — 인사(/me) → 공지 띠 → 오늘 스터디 카드(사전 출석 · QR 출석) → 스터디
      맵(진도는 learn 도메인) → 라운지 미리보기 → 앱 시작 팝업.

      출석은 백엔드 MobileStudyController(/study/...) + TableScanController(/tables/...) 로 맞춰요.
  - name: 알림 · 공지
    description: 화면 app/notifications.tsx (알림함) · app/notice/index.tsx ·
      app/notice/[id].tsx · components/home/notice-strip.tsx (홈 Notice board 띠)
  - name: 공통 · 설정값
    description: 앱 부팅 설정(/config) · 앱 버전 확인 · 푸시 토큰 · 문구(/contents) · 마스터데이터 선택지 · 내
      지점 · 이미지 업로드
  - name: 가입 · 온보딩
    description: >
      화면 app/welcome.tsx (첫 화면 · 카카오로 시작하기) → app/onboarding/terms.tsx (약관) →
      nickname.tsx → character.tsx → member.tsx (지점 회원이에요?)

      → 회원: link.tsx → link-wait.tsx / 체험: trial.tsx → trial-done.tsx / 앱 구경: langs.tsx → why.tsx → 홈. 못 찾음 결과는 app/link-rejected.tsx.

      기준 문서: docs/pages/09-onboarding.md · docs/frontend/api-additions.md A19 ~ A23.

      여기 없는 것은 다른 태그 API 를 그대로 써요: 로그인 loginWithProvider · 약관 listAppOnboardingConsents / submitOnboardingConsents · 체험 listPublicBranches / getTrialInquiryOptions / listTrialSlots / submitTrialBooking (인증 · 시작),

      닉네임 저장 updateMyProfile · 연동 요청 listLinkableBranches / createBranchLinkRequest (마이 · 수강).

      지점이 연동해 주기 전에는 어떤 길을 골라도 비회원 권한(GET /me role guest)이에요.
  - name: 라이브러리
    description: >
      화면 app/(tabs)/library.tsx (스터디 맵 · 상황 맵 3D 섬) · app/book/[id].tsx (잠긴 교재
      소개) · app/unit/[id].tsx (과 화면) · app/listening.tsx (리스닝 룸).

      3D 섬 모양(프리셋 · 정류장 수)은 앱 코드(components/library/world/presets.ts)에 있고, 서버는 내용(이름 · 색 · 장면 · 공개일 · 순서)만 보내요 (docs/frontend/map-data.md).

      백엔드의 /materials(교재 PDF 열람 · 북마크 · 예습 퀴즈 세트)는 'PDF 교재' 개념이라 책장 · 섬 지도 모양과는 달라요. 같은 Textbook 을 원천으로 써도 되지만 응답은 새로 만들어야 해요 (각 API 설명 참고).
  - name: 학습 · 레슨
    description: >
      화면 app/lesson/[step].tsx (Lv.1 · 2 패턴형) · app/lesson34/[step].tsx (Lv.3
      TOPIC · Lv.4 DEBATE) · app/scene/[id]/index.tsx ·
      app/scene/[id]/[step].tsx (상황 장면).

      서버는 과 콘텐츠 한 덩어리(LessonData · Unit34 · SceneContent)를 저장 · 내려 주기만 해요. 문제 카드(Task)는 앱이 콘텐츠에서 만들어요 — 서버가 문제 카드 모양을 알 필요는 없어요.
  - name: 진도 · 보상
    description: >
      끝낸 단계 · 멈춘 곳(이어서) · 마지막 단계 · 오늘 목표 · 구간 건너뛰기 · 과 보상 상자. 지금은
      state/progress.ts · state/today-goal.ts · state/chest.ts · state/ledger.ts
      가 기기에 저장해요.

      화면 components/home/study-map.tsx · components/home/skip-sheet.tsx · app/unit/[id].tsx · 모든 레슨 축하 화면(components/lesson/celebrate.tsx).

      포인트 · 오늘 목표 · 연속 학습 · 보상은 서버가 계산해요 (앱은 응답을 그대로 보여 줘요).
  - name: 음성 · AI
    description: >
      말하기 채점 · AI 대화 · AI 교정. 지금 음성 인식은 기기(expo-speech-recognition · 브라우저)가 하고,
      AI 대화 · 교정은 프로토타입 대본 + 규칙으로 흉내 내요

      (components/lesson/talk-view.tsx · components/scene/talk.tsx · components/scene/talk-grade.ts · components/lesson34/text.ts · lib/words.ts).
  - name: 표현함
    description: >
      내 표현함 (#29). 레슨 · 상황 장면 · 리스닝 룸 · AI 대화에서 표현을 저장 · 빼기. 지금은
      state/expressions.ts (기기 저장 · 예시 14개).

      백엔드 /learning/expression-notes 는 첨삭 결과에서만 저장할 수 있어서 직접 저장 · 필드 추가가 필요해요.
  - name: 라운지 피드
    description: >
      화면 app/(tabs)/lounge.tsx (추천 · 커뮤니티 탭) · app/post/[id].tsx ·
      app/compose.tsx · components/lounge/post-card.tsx

      백엔드 community/PostController · CommentController 를 그대로 쓰고, 앱의 카드 모양에 모자란 필드만 더해요.

      주의: 백엔드 PostCategory(PALLO_LOUNGE · BRANCH_LOUNGE · OVERSEAS_LIFE · TRAVEL_SQUARE)는 "게시판" 축이고,

      앱의 커뮤니티 칩(일상 · 스터디 · 이벤트 · 여행 · 동아리 · 번개)은 "주제" 축이에요 → topic 필드를 새로 둬요.
  - name: 스토리
    description: >
      화면 components/lounge/story-row.tsx · app/story/[id].tsx ·
      app/story/new.tsx. 백엔드에 없음(전부 new).

      24시간 안 = 사람 줄, 지나면 고른 카테고리 하이라이트, 매니저 고정은 하이라이트 맨 앞 — 서버가 나눠서 내려줘요.
  - name: 번개
    description: >
      화면 components/meet/meet-tab.tsx · app/meet/[id].tsx · app/meet/new.tsx ·
      components/meet/detail/*.

      앱의 '번개' = 백엔드 hangout (MobileHangoutController, /hangouts).
  - name: 동아리
    description: >
      화면 components/meet/club-list.tsx · app/club/[id].tsx · app/club/new.tsx ·
      components/meet/club/*.

      백엔드 club/MobileClubController (/clubs). 앱의 '정기 모임' = 백엔드 club meeting (/clubs/{id}/meetings).
  - name: 여행 · 해외살이
    description: >
      화면 app/(tabs)/lounge.tsx 해외 동행 탭 · components/lounge/trip.tsx ·
      app/trip/[id].tsx. 동행 · 해외살이 카드는 백엔드에 없음.

      해외살이 이야기 글은 community 글(category=OVERSEAS_LIFE)로 받아요.
  - name: 신고 · 차단
    description: >
      화면 components/common/report-sheet.tsx (글 · 댓글 · 스토리 · 멤버 · 번개 · 동아리 ⋯ 메뉴
      공통). 백엔드에 앱용 신고 · 차단 없음.

      차단 목록 보기 · 내 신고 내역(설정 화면)은 me 도메인 몫이에요.
  - name: 챌린지
    description: >
      라운지 '챌린지' 탭 (components/challenge/challenge-tab.tsx) · 상세
      app/challenge/[id].tsx · 열기 app/challenge/new.tsx.

      두 종류: 일상 챌린지(kind=daily — 기간 · 인증 주기 · 순위) / 표현 챌린지(kind=expression — '나만의 문장 완성하기', 기간만, 문장을 달면 참여).

      백엔드 MobileChallengeController(/challenges) 가 일상 챌린지 뼈대를 이미 가지고 있어요. 표현 챌린지 · 순위 · 찜 · 같은 표현 확인은 새로 필요해요.
  - name: 이벤트
    description: >
      하단 '이벤트' 탭 app/(tabs)/event.tsx · 상세 app/events/[id].tsx · 제안
      app/events/propose.tsx.

      지점 · 본사가 여는 파티 · 클래스 · 여행. 신청(설문 답) → 무료는 바로 확정 / 유료는 입금 대기(24시간) → 입금 확인되면 확정.

      백엔드에 이벤트 도메인이 없어요 (api/app 전체에 event 없음) — 모두 새로 필요해요.
  - name: 마이
    description: >
      화면 app/(tabs)/my.tsx (캐릭터 룸 · 숫자 4칸 · 내 활동) · app/me/delete.tsx ·
      app/me/settings/login.tsx.

      내 정보(GET /me) · 마이 집계(BFF) · 내 정보 수정 · 로그인 연결 · 탈퇴.
  - name: 프로필 · 팔로우
    description: 화면 app/me/profile/[id].tsx · components/my/profile-sheet.tsx ·
      components/my/my-sheets.tsx (FollowSheet) — 멤버 프로필 · 팔로우 (A6)
  - name: 랭킹 · 배지
    description: 화면 app/me/ranking.tsx · components/my/my-blocks.tsx (RankSummary ·
      BadgeGrid) · BadgeSheet
  - name: 캐릭터 · 상점
    description: 화면 app/me/customize.tsx · components/character/** · state/avatar.ts
      · state/ledger.ts — 꾸미기 · 스파크 상점 · 스파크/포인트 장부 (A3)
  - name: 수강 · 결제
    description: 화면 app/me/pass.tsx · app/me/change.tsx · app/me/study.tsx ·
      app/me/payments.tsx · components/account/my-study-card.tsx ·
      components/my/branch-board.tsx (A8) · app/me/settings/langlv.tsx
  - name: 프로 노트
    description: 화면 app/me/notes/index.tsx · app/me/notes/[id].tsx ·
      components/account/pro-note-card.tsx · diary-list.tsx · pro-note-parts.tsx
      (A7). 회원이 받는 쪽 (쓰는 쪽은 리더 노트 탭 몫)
  - name: 설정 · 지원
    description: 화면 app/me/settings/* (index · reports · terms · term · version ·
      notices) · app/me/support.tsx — 설정 · 차단 목록(A11) · 신고 내역(A10) · FAQ · 1:1
      문의 · 약관 · 앱 버전
paths:
  /abroad-profiles:
    get:
      tags:
        - 여행 · 해외살이
      operationId: listAbroadProfiles
      summary: 해외에 있는 PALLO 사람들 (여권 카드)
      description: |
        화면: app/(tabs)/lounge.tsx 해외살이 칩 · trip.tsx PeopleRow · PersonSheet
        규칙: 내 카드가 있으면 맨 앞(mine=true). 나라 필터. 차단 관계 빼요.
      x-status: new
      x-inventory: "#73"
      x-screens:
        - app/(tabs)/lounge.tsx
        - components/lounge/trip.tsx
      x-app-code: data/lounge.ts LG_PEOPLE · lounge-store.ts people
      parameters:
        - name: countryCode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AbroadCountryCode"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbroadProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
      x-domain: lounge
  /ai/feedback:
    post:
      tags:
        - 음성 · AI
      operationId: aiFeedback
      summary: AI 교정 · 칸 나누기 · 업그레이드 · 토론 점수 · 질문 날카로움 · 일기 정리
      description: >
        화면 · 지금 규칙으로 흉내 내는 곳 (components/lesson34/text.ts 머리말 "실제 앱은
        AI(/ai/feedback)"):

        - fix: 한 문장 교정 (오타 · 문법 · 대문자) — lib/words.ts fixSentence · text.ts aiFix · polishLive(Lv.3 live 규칙) · blocks/say.tsx 'AI 교정'

        - split: 답을 칸으로 나누기 (choice · reason · example · society) — text.ts splitAnswer (FREE TALK 준비 · 내 입장 리허설)

        - upgrade: 평소 표현 → 업그레이드 표현 — text.ts upgradeOf · polish (SAY IT BETTER)

        - debate-score: 토론 점수 논리 · 근거 · 표현 · 유창성 각 5점 + MVP 문장 — blocks/misc.tsx ScoreBlock

        - sharpness: 내 질문 날카로움 1~5 + 상대 답 — corners.ts FOLLOW-UP (extra kind sharp)

        - journal: 일기 정리 (쓴 표현 · 고친 곳) — corners.ts JOURNAL (extra kind journal)

        - chal: 30초 챌린지 답 채점 (오늘 패턴 썼는지 · 모범 답) — components/lesson/chal-view.tsx

        백엔드 관계: fix 는 백엔드 AI 첨삭(POST /learning/corrections/sync → GET /learning/corrections/{id}, feedback[before · after · explanation])과 같은 일이라

        내부적으로 CorrectionService · AIConnection 을 써도 돼요. 다만 그 API 는 첨삭 기록에 남고 두 번 불러야 해서 레슨 중 실시간 교정엔 그대로 못 써요 → 새 API.
      x-status: new
      x-inventory: "#28"
      x-screens:
        - components/lesson34/blocks/say.tsx
        - components/lesson34/pages/dtalk.tsx
        - components/lesson34/blocks/misc.tsx
        - components/lesson34/corners.ts
        - components/lesson/chal-view.tsx
        - components/lesson/talk-view.tsx
      x-app-code: components/lesson34/text.ts splitAnswer · upgradeOf · polish · aiFix
        · notEnglish · lib/words.ts fixSentence · gradeTalk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiFeedbackRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiFeedbackResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: AI 사용 불가 (ai_unavailable · 앱은 규칙 기반 결과로 대신해요)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-domain: learn
  /ai/talk:
    post:
      tags:
        - 음성 · AI
      operationId: aiTalkTurn
      summary: AI 대화 한 턴 (프리토킹 · 역할극 · 미션 대화 · DAILY TOPIC · FREE TALK · 토론)
      description: >
        화면 · 지금 흉내 내는 곳 (모두 콘텐츠의 정해진 대본 lines/replies 를 차례로 보여 줘요):

