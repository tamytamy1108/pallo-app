        tw:
          type: string
          description: ⚠ 주제 낱말 (벗어났는지 볼 때). 지금 앱은 RegExp 객체(/crazy|popular|…/i) → JS 정규식
            소스 문자열로 바꿔 주세요 (플래그 i)
          example: crazy|popular|everyone|trend|understand|hooked|love|obsess|fan|why
    LiveFixRule:
      type: object
      description: LiveFix 의 JSON 모양 (제안). 앱은 new RegExp(find, flags) 로 찾고 replace 를 차례로 적용
      required:
