          items:
            type: string
            enum:
              - MON
              - TUE
              - WED
              - THU
              - FRI
              - SAT
              - SUN
          example:
            - MON
            - WED
            - FRI
        label:
          type: string
          description: 카드 일정 줄 문구 (서버가 만들어도, 앱이 만들어도 돼요)
          example: 주 3회 · 월·수·금
