        content:
          type:
            - string
            - "null"
        imagePaths:
          type: array
          items:
            type: string
        thumbnailPaths:
          type: array
          items:
            type: string
        aspectRatio:
          type:
            - number
            - "null"
          description: (추가) 사진 비율
        authorCode:
          type: string
        authorName:
          type: string
        authorAvatarPath:
          type:
            - string
            - "null"
        likeCount:
          type: integer
        viewerLiked:
          type: boolean
        commentCount:
          type: integer
