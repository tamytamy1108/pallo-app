        - replace
        - why
      properties:
        find:
          type: string
          description: 찾는 JS 정규식 소스
          example: \b(i'm|i am)\s+agree\b
        flags:
          type: string
          default: i
          example: i
        replace:
          type: array
          description: 차례로 적용할 치환 [정규식 소스, 바꿀 글($1 사용 가능)]
          items:
            type: array
            prefixItems:
              - type: string
              - type: string
            minItems: 2
            maxItems: 2
          example:
            - - \b(i'm|i am)\s+agree
              - I agree
            - - \b(he|she)('s| is)\s+agree
              - $1 agrees
        why:
          type: string
          description: 이유 (한국어)
          example: agree는 동사라 be동사를 붙이지 않아요
