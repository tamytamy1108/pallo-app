      description: >
        화면: app/lesson/[step].tsx (Lv.1 · 2) · app/lesson34/[step].tsx (Lv.3 ·
        4) · app/scene/[id]/index.tsx · app/scene/[id]/[step].tsx (상황 장면)

        언제: 단계 화면 열 때 · 같은 과의 다른 단계는 받아 둔 값 그대로 (10분 캐시)

        id: 교재 '레벨-과' (1-1 · 2-1 · 3-101 · 4-101) · 상황 장면은 맵 데이터 장면 줄의 contentId (travel-1). 없으면 404 → 앱 '준비 중'.

        응답 = kind 로 나뉘는 네 모양 (앱 TS 타입 그대로):

        - pattern (Lv.1 · 2) = LessonData (data/lessons.ts)

        - topic (Lv.3) = Unit34 lv 3 (data/lessons34.ts Lv3Unit)

        - debate (Lv.4) = Unit34 lv 4 (Lv4Unit)

        - scene = SceneContent (data/situation-content.ts)

        kind 는 지금 앱이 읽지 않지만 저장 · 검증 · 관리자 웹 편집기용으로 넣어 주세요 (앱은 모르는 필드를 무시해요).

        앱이 콘텐츠로 만드는 문제 카드 종류 (서버 저장 X, 참고용):

        Lv.1 · 2 Task = shadow · order · role · build · match · answer · pick (data/lessons.ts),

        Lv.3 · 4 Task34 = say · pick · match · explain · choose · blind · duo · score · exprs · read · fill, 카드 = kw2 · chips · bg · before · plain · useful · guide, 결과 추가 = journal · sharp (components/lesson34/types.ts).

