        posterWords:
          type: array
          items:
            type: string
          maxItems: 2
          description: (추가) 카드 왼쪽 색 칸 문구 두 줄. 비면 카테고리 문구
          example:
            - WALK
            - 30 MIN
        verifyMethod:
          $ref: "#/components/schemas/ChallengeVerifyMethod"
        schedule:
