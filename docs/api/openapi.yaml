      type: string
      description: >
        백엔드 MobileGroupViewerRole — 뷰어와 모임의 관계 하나. HOST 방장 · MEMBER 참여/가입 ·
        PENDING 신청 대기 · REJECTED 거절 · KICKED 강퇴

        · ELIGIBLE 동아리 멤버인데 이 모임 미참여 · OUTSIDER 동아리 비멤버 · NONE 관계 없음
      enum:
        - HOST
        - MEMBER
        - PENDING
        - REJECTED
        - KICKED
        - ELIGIBLE
        - OUTSIDER
        - NONE
      example: NONE
    LifecycleStatus:
      type: string
      description: 백엔드 LifecycleStatus (동아리 · 행아웃 공용). 행아웃은 PENDING/REJECTED 없음
      enum:
        - PENDING
        - ACTIVE
        - REJECTED
        - SUSPENDED
        - CLOSED
      example: ACTIVE
