          description: 상세 (백엔드 MobileChallengeDetailResponse + 추가 항목)
          required:
            - status
            - commentsAllowed
          properties:
            description:
              type:
                - string
                - "null"
              maxLength: 200
            joinMode:
              type: string
              enum:
                - OPEN
                - APPROVAL
              description: 앱은 늘 OPEN
            maxParticipants:
              type:
                - integer
                - "null"
            commentsAllowed:
              type: boolean
            targetAudience:
              type:
                - string
                - "null"
            participationCondition:
              type:
                - string
                - "null"
            guideText:
              type:
                - string
                - "null"
              maxLength: 300
              description: 어떻게 인증하나요? (인증 가이드)
              example: 아침 식단 사진 한 장 + 한 줄 소감 · 영어로 쓰면 더 좋아요
            status:
              type: string
              description: 라이프사이클 (승인 대기 · 진행 · 반려 · 중지 · 종료)
              example: ACTIVE
            hostAvatarPath:
              type:
                - string
                - "null"
            myProgress:
              oneOf:
                - $ref: "#/components/schemas/ChallengeMyProgress"
                - type: "null"
            rejectionReason:
              type:
                - string
                - "null"
            statusReason:
              type:
                - string
                - "null"
            viewerCode:
              type: string
              description: 내 회원 코드
            week:
              type: array
              description: (추가) 내 인증 7일 — 6일 전 → 오늘 순. 참여 안 했으면 빈 배열
              maxItems: 7
              items:
                type: object
                required:
                  - date
                  - verified
                properties:
                  date:
                    type: string
                    format: date
                  verified:
                    type: boolean
            recentVerifications:
              type: array
              maxItems: 3
              description: (추가) 홈 탭 최근 인증
              items:
                $ref: "#/components/schemas/ChallengeVerification"
    ChallengeCreateRequest:
      type: object
      description: 챌린지 열기 (백엔드 MobileChallengeCreateRequest 목표 모양)
      required:
        - kind
        - category
        - startDate
        - endDate
      properties:
        kind:
          $ref: "#/components/schemas/ChallengeKind"
        title:
          type:
            - string
            - "null"
          maxLength: 30
          description: 일상 필수. 표현이면 비워요 (표현이 이름)
          example: 매일 30분 걷기
        category:
          $ref: "#/components/schemas/ChallengeCategory"
        startDate:
          type: string
          format: date
          description: 오늘 · 내일 · 다음 주 월요일 (표현은 오늘)
          example: 2026-11-25
        endDate:
          type: string
          format: date
          description: startDate + 기간 - 1 (일상 3 · 7 · 14 · 21 · 30일 / 표현 3 · 7 · 14 · 30일)
          example: 2026-12-15
        verifyCycle:
          type: string
          enum:
            - DAILY
            - WEEKLY
          description: 일상만. 표현은 DAILY
          example: DAILY
        weeklyCount:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 6
        weekdays:
          type: array
          items:
            type: string
            enum:
              - MON
              - TUE
              - WED
              - THU
              - FRI
              - SAT
              - SUN
          description: WEEKLY 면 정확히 weeklyCount 개
        verifyMethod:
          type: string
          enum:
            - TEXT_ONLY
            - PHOTO_AND_TEXT
          description: 표현은 TEXT_ONLY 고정
          example: PHOTO_AND_TEXT
        guideText:
          type:
            - string
            - "null"
          maxLength: 300
          description: "비우면 서버 기본 (사진: 사진 한 장 + 한 줄 · 댓글: 댓글 한 줄)"
        posterWords:
          type: array
          maxItems: 2
          items:
            type: string
            maxLength: 9
            pattern: ^[A-Z0-9 :.!?&+\-]*$
          description: 카드 문구 (대문자). 비면 카테고리 문구
          example:
            - WALK
            - 30 MIN
        description:
          type:
            - string
            - "null"
          maxLength: 200
          description: 앱에 칸 없음 → 선택으로
        imagePath:
          type:
            - string
            - "null"
          description: 선택 — POST /uploads/images/challenge-cover 의 path
        expressionIds:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
          description: 표현만 — 내 표현함 저장 표현 id (A13). 지금은 하나만
          example:
            - ex-01J9Y
        firstEntry:
          type:
            - string
            - "null"
          maxLength: 500
          description: 표현만 — 내가 먼저 만든 문장 (첫 문장으로 달려요)
          example: I’m on the fence about moving to Busan.
