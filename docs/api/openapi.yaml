    StartScreen:
      type: object
      description: 관리자 웹에 올린 시작 화면 하나 (data-model StartScreen)
      required:
        - id
        - images
        - bgColor
        - imageAlt
        - from
      properties:
        id:
          type: string
          example: ss-party
        images:
          type: object
          description: 같은 그림을 화면 비율 3가지로. 앱은 기기에 맞는 한 장만 받아요
          required:
            - short
            - regular
            - long
          properties:
            short:
              type: string
              format: uri
              description: 1242 × 2208 (1.78 · 아이폰 SE · 8)
              example: https://cdn.example/ss-party-1242x2208.jpg
            regular:
              type: string
              format: uri
              description: 1290 × 2780 (2.155 · 아이폰 X 이후 · 갤럭시 S)
              example: https://cdn.example/ss-party-1290x2780.jpg
            long:
              type: string
              format: uri
              description: 1290 × 2866 (2.22 · 20:9 이상 · 플립)
              example: https://cdn.example/ss-party-1290x2866.jpg
        bgColor:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          description: 화면이 그림보다 길 때 남는 아래(또는 태블릿 양옆) 채우는 색. 어두우면 앱이 버튼 · 링크를 흰색으로
          example: "#1E1A2B"
        imageAlt:
          type: string
          description: 그림 속 글씨 그대로 (화면 읽기 프로그램용)
          example: 연말 랭귀지 파티 포스터. 12월 20일 토요일 저녁 7시, 전 지점.
        from:
          type: string
          format: date
          example: 2026-12-01
        until:
          type:
            - string
            - "null"
          format: date
          description: 비면 계속
          example: 2026-12-20
    StartScreenBundle:
      type: object
