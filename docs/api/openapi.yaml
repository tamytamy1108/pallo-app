  "/me/progress/{lessonId}/steps/{stepId}/complete":
    post:
      tags:
        - 진도 · 보상
      operationId: completeStudyStep
      summary: 단계 끝내기 → 포인트 · 오늘 목표 · 다음 단계
      description: >
        화면: components/lesson/use-step-finish.ts (Lv.1 · 2) ·
        components/lesson34/finish.tsx (Lv.3 · 4) ·
        components/scene/step-frame.tsx (상황 장면) → 축하 화면
        components/lesson/celebrate.tsx

        언제: 단계 마지막 문제를 끝냈을 때

        서버가 계산 (지금 앱 규칙 그대로):

        - 처음 끝낼 때만 단계 포인트 xp (단계표: Lv.1 · 2 pat 5 · dlg 10 · bank 5 · sit 15 · story 15 · talk 15 · quiz 10 · chal 10 / Lv.3 · 4 · 장면은 data/library.ts STUDY_STEPS · data/situation.ts SCENE_STEPS). 다시 해도 0.

        - 빠른 답 보너스 (Lv.1 · 2 만): speed = round(xp × 0.5 × fast / timed). 지난 최고 speed 보다 큰 만큼만 더 줘요 (gain = max(0, speed − best)), best 갱신.

        - 포인트 장부 이벤트 id: 'step:{진도 키}' · 'speed:{진도 키}:{speed}' — 같은 id 는 두 번 안 줘요 (state/ledger.ts). 이번 주 포인트(weekPoints)에 더해요.

        - 오늘 목표: 처음 끝낸 단계를 오늘 날짜에 한 번만 셈.

        - 상황 장면: 다섯 단계(mis flow bank exq talk)를 다 끝낸 순간 장면 도장(scene:장면 id)도 찍어요 → sceneStamped.

        - 단계 끝내면 멈춘 곳(pos · snapshot)은 지워요.

        - next: 같은 구역(예습 · 본학습 · 복습)의 안 한 단계 → 다음 구역 (data/lessons.ts nextStepAfter).

        상황 퀴즈(exq)는 best 에 '레벨별 최고 맞힌 수'도 남겨요 (quizLevel 을 같이 보내면).
