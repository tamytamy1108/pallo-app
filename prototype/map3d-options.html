<title>3D 맵 시안</title>

<style>
:root{--ink:#1E1A2B;--cream:#F8F4EA;--sub:#7A7386;--y:#FFE200;--p:#493087}
*{box-sizing:border-box}
body{margin:0;background:#E9E2D2;font-family:'Noto Sans KR',sans-serif;color:var(--ink);padding:28px 24px}
.row{display:flex;gap:26px;flex-wrap:wrap}
.col{width:340px}
.lab{font-family:Lexend;font-weight:800;font-size:22px;margin:0 0 4px}.lab small{font-family:'Noto Sans KR';font-size:14px;font-weight:900;color:var(--p);margin-left:6px}
.desc{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 12px;min-height:38px;line-height:1.5}
.card{position:relative;width:340px;height:520px;border:2.5px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:4px 5px 0 var(--ink);background:#BFE4EC;touch-action:none}
.card canvas{display:block;width:100%;height:100%}
.tag{position:absolute;z-index:3;transform:translate(-50%,0);padding:2px 8px 3px;border-radius:11px;border:2px solid var(--ink);background:#fff;font-size:11px;font-weight:900;white-space:nowrap;pointer-events:none;line-height:1.3}
.tag.soon{border-style:dashed;border-color:#9A93A6;color:#6F6880;background:rgba(255,255,255,.85)}
.tag.cur{background:var(--y);box-shadow:2px 2px 0 var(--ink)}
.here{position:absolute;z-index:4;transform:translate(-50%,-100%);height:20px;padding:0 9px;border-radius:10px;background:var(--ink);color:var(--y);font-size:10px;font-weight:900;display:flex;align-items:center;pointer-events:none;font-family:Lexend}
.ttl{position:absolute;left:16px;top:14px;z-index:5;pointer-events:none}
.ttl b{display:block;font-family:Lexend;font-size:19px;font-weight:800;letter-spacing:-.3px}
.ttl span{font-size:11.5px;font-weight:800;color:var(--sub)}
.foot{position:absolute;left:16px;right:16px;bottom:14px;z-index:5;pointer-events:none;font-size:12px;font-weight:900;display:flex;flex-direction:column;gap:7px}
.foot .bar{height:10px;border-radius:5px;border:1.6px solid var(--ink);background:#fff;overflow:hidden}.foot .bar i{display:block;height:100%;width:25%;background:var(--y);border-right:1.6px solid var(--ink)}
.foot .r{display:flex;justify-content:space-between}.foot .r span{color:var(--sub)}
.zp{position:absolute;left:12px;right:12px;bottom:12px;z-index:6;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-radius:18px;border:2px solid var(--ink);background:#fff;box-shadow:3px 4px 0 var(--ink);transform:translateY(130%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.zp.on{transform:none}
.zp .t{flex:1;min-width:0}.zp small{display:block;font-size:11px;font-weight:900;color:var(--p)}.zp b{font-size:16px;font-weight:900}
.zp .go{flex:none;height:40px;padding:0 16px;border-radius:20px;border:2px solid var(--ink);background:var(--y);font:inherit;font-size:13px;font-weight:900;cursor:pointer}
.zp .go.soon{background:#EFEAE0;color:#8C8597;border-style:dashed;border-color:#9A93A6}
.zp .x{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.mt{display:flex;gap:8px;margin:0 0 18px}.mt a{height:36px;padding:0 16px;border-radius:18px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:13.5px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center}.mt a.on{background:var(--ink);color:#fff}
.hint{position:absolute;right:14px;top:16px;z-index:5;font-size:10.5px;font-weight:900;color:#3E5A62;background:rgba(255,255,255,.75);padding:3px 8px;border-radius:9px}
</style>

{
