<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 섬 맵 시안</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Lexend:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E1A2B;--sub:#7A7386;--y:#FFE200;--p:#493087}
*{box-sizing:border-box}
body{margin:0;background:#E9E2D2;font-family:'Noto Sans KR',sans-serif;color:var(--ink);padding:28px 24px}
.row{display:flex;gap:22px;flex-wrap:wrap}
.col{width:340px}
.lab{font-family:Lexend;font-weight:800;font-size:22px;margin:0 0 4px}.lab small{font-family:'Noto Sans KR';font-size:14px;font-weight:900;color:var(--p);margin-left:6px}
.desc{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 12px;min-height:38px;line-height:1.5}
.card{position:relative;width:340px;height:520px;border:2.5px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:4px 5px 0 var(--ink);touch-action:none}
.card canvas{display:block;width:100%;height:100%}
.tag{position:absolute;z-index:3;transform:translate(-50%,0);padding:2px 8px 3px;border-radius:11px;border:2px solid var(--ink);background:#fff;font-size:11px;font-weight:900;white-space:nowrap;pointer-events:none;line-height:1.3}
.tag.soon{border-style:dashed;border-color:#9A93A6;color:#6F6880;background:rgba(255,255,255,.88)}
.card:not(.z) .tag.min{width:20px;height:20px;padding:0;border-radius:50%;display:grid;place-items:center;font-family:Lexend;font-size:10px;line-height:1}
.card:not(.z) .tag.min .f,.card.z .tag.min .s{display:none}
.tag.cur{background:var(--y);box-shadow:2px 2px 0 var(--ink)}
.here{position:absolute;z-index:4;transform:translate(-50%,-100%);height:20px;padding:0 9px;border-radius:10px;background:var(--ink);color:var(--y);font-size:10px;font-weight:900;display:flex;align-items:center;pointer-events:none;font-family:Lexend}
.ttl{position:absolute;left:14px;top:12px;z-index:5;pointer-events:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:16px;background:rgba(255,255,255,.9);border:2px solid var(--ink)}
.ttl i{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--ink)}
.ttl b{font-size:13.5px;font-weight:900}.ttl span{font-size:11px;font-weight:800;color:var(--sub)}
.zp{position:absolute;left:12px;right:12px;bottom:12px;z-index:6;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-radius:18px;border:2px solid var(--ink);background:#fff;box-shadow:3px 4px 0 var(--ink);transform:translateY(130%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.zp.on{transform:none}
.zp .t{flex:1;min-width:0}.zp small{display:block;font-size:11px;font-weight:900;color:var(--p)}.zp b{font-size:16px;font-weight:900}
.zp .go{flex:none;height:40px;padding:0 16px;border-radius:20px;border:2px solid var(--ink);background:var(--y);font:inherit;font-size:13px;font-weight:900;cursor:pointer}
.zp .go.soon{background:#EFEAE0;color:#8C8597;border-style:dashed;border-color:#9A93A6}
.zp .x{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
</style>

<div class="row">
  <div class="col"><p class="lab">1<small>여행</small></p><p class="desc">하늘색 바다 위 콩 모양 섬. 관제탑 · 호텔 · 야자수, 하늘엔 비행기.</p><div class="card" id="mTravel"></div></div>
  <div class="col"><p class="lab">2<small>비즈니스</small></p><p class="desc">노을 지는 저녁 도시. 네모난 2층 섬 위 빌딩 숲에 불이 켜져요.</p><div class="card" id="mBiz"></div></div>
  <div class="col"><p class="lab">3<small>카페</small></p><p class="desc">라테 위에 뜬 케이크 섬. 크림 위 카페와 파라솔, 큰 커피잔.</p><div class="card" id="mCafe"></div></div>
  <div class="col"><p class="lab">4<small>캠퍼스 · 어학연수</small></p><p class="desc">하늘에 뜬 섬. 시계탑 학교 · 운동장 · 연, 주변에 작은 돌섬이 떠다녀요.</p><div class="card" id="mCampus"></div></div>
</div>
