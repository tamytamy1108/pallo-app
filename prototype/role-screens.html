<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>역할별 앱 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Noto+Sans+KR:wght@600;700;800;900&display=swap">
<style>
:root{--cream:#FBF6EA;--ink:#1E1A2B;--sub:#5A5366;--line:#E3DCCB;--pink:#E0457B;--fd:'Unbounded','Noto Sans KR',sans-serif;--fb:'Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#E7E0CF;font-family:var(--fb);color:var(--ink);word-break:keep-all}
.wrap{padding:22px 26px 80px;max-width:1600px}
h1{font-family:var(--fd);font-size:21px;margin:0 0 6px;letter-spacing:-.5px}
.lead{font-size:13.5px;font-weight:700;color:var(--sub);margin:0 0 6px;line-height:1.65;max-width:1000px}
.lead i{font-style:normal;outline:2.5px dashed var(--pink);outline-offset:1px;border-radius:5px;padding:0 4px;color:var(--ink)}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;padding:12px 0;background:#E7E0CF}
.tabs button{font:900 13.5px var(--fb);height:40px;padding:0 16px;border-radius:20px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:2px 3px 0 var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.pg{display:none}.pg.on{display:block}
.intro{font-size:13px;font-weight:700;color:var(--sub);margin:4px 0 14px;line-height:1.6;max-width:1000px}
.sec{font-size:15px;font-weight:900;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.col{width:250px}
.who{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:13px;border:2px solid var(--ink);background:#fff;font-size:12.5px;font-weight:900;margin-bottom:8px}
.who.m{background:var(--ink);color:#fff}
.shot{position:relative;width:250px;border:2.5px solid var(--ink);border-radius:30px;overflow:hidden;box-shadow:4px 5px 0 var(--ink);background:var(--cream)}
.shot img{display:block;width:100%;height:auto}
.ovl{position:absolute;left:0;right:0;bottom:0;background-repeat:no-repeat;background-size:100% auto;background-position:center bottom}
.dim{position:absolute;inset:0;background:rgba(30,26,43,.42)}
.same{width:250px;aspect-ratio:390/844;border:2.5px dashed #BFB59F;border-radius:30px;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:800;color:#8D8574;padding:20px;line-height:1.6}
ul.ch{margin:10px 0 0;padding:0;list-style:none}
ul.ch li{font-size:12px;font-weight:700;line-height:1.5;padding:3px 0 3px 14px;position:relative}
ul.ch li:before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--pink)}
ul.ch li.q{color:var(--sub)}ul.ch li.q:before{background:#E0A21E}
.ovw{overflow-x:auto;background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink)}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:12.5px}
th,td{padding:9px 11px;text-align:left;vertical-align:top;border-bottom:1.5px solid var(--line);line-height:1.5;font-weight:700}
thead th{background:var(--ink);color:#fff;font-weight:900;white-space:nowrap}
tbody th{background:var(--cream);font-weight:900;white-space:nowrap;width:120px}
td.eq{color:#B3AA98;font-weight:900}
tr:last-child th,tr:last-child td{border-bottom:0}
.note{font-size:12px;font-weight:700;color:var(--sub);margin-top:10px;line-height:1.6;max-width:1000px}

<div class="wrap">

<div id="pages"></div>
</div>

const tabs = document.getElementById('tabs'), pages = document.getElementById('pages');
PAGES.forEach((p) => {
  const b = document.createElement('button'); b.textContent = p.name; b.dataset.k = p.k; tabs.appendChild(b);
  const s = document.createElement('section'); s.className = 'pg'; s.id = 'p-' + p.k; s.innerHTML = p.html; pages.appendChild(s);
});
const show = (k) => { document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.k === k)); document.querySelectorAll('.pg').forEach((s) => s.classList.toggle('on', s.id === 'p-' + k)); try { history.replaceState(null, '', '?tab=' + k); } catch (e) {} };
tabs.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.k); });
show(new URLSearchParams(location.search).get('tab') || 'all');
</script>
