<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>역할별 앱 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Noto+Sans+KR:wght@500;700;800;900&display=swap">
<style>
:root{--cream:#FBF6EA;--ink:#1E1A2B;--sub:#5A5366;--line:#E3DCCB;--purple:#493087;--lav:#E5DDF6;--yellow:#FFE200;--pink:#D0798E;--deep:#DE7593;--sky:#8FA6DC;--mist:#E3EAF8;--green:#2E9E6A;--red:#D9443B;--en:#4463A8;--ja:#F06593;--fd:'Unbounded','Noto Sans KR',sans-serif;--fb:'Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#E7E0CF;font-family:var(--fb);color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{padding:24px 26px 80px;max-width:1700px}
h1{font-family:var(--fd);font-size:22px;margin:0 0 6px;letter-spacing:-.5px}
.lead{font-size:13.5px;font-weight:700;color:var(--sub);margin:0 0 16px;line-height:1.6;max-width:960px}
/* 역할 탭 */
.rtabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;padding:12px 0;background:#E7E0CF}
.rtabs button{font:900 14px var(--fb);height:42px;padding:0 18px;border-radius:21px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:2px 3px 0 var(--ink);display:flex;align-items:center;gap:8px}
.rtabs button small{font:800 11px var(--fb);color:var(--sub)}
.rtabs button.on{background:var(--ink);color:#fff}.rtabs button.on small{color:#CFC6E6}
.role{display:none}.role.on{display:block}
.diff{background:var(--cream);border:2px solid var(--ink);border-radius:22px;box-shadow:3px 4px 0 var(--ink);padding:14px 18px;margin:6px 0 22px;max-width:1080px}
.diff h2{font-family:var(--fb);font-size:17px;font-weight:900;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.diff ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:6px 22px}
.diff li{font-size:13px;font-weight:700;line-height:1.5;padding-left:16px;position:relative}
.diff li:before{content:"";position:absolute;left:2px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.diff li b{font-weight:900}
.diff .same{margin-top:10px;font-size:12px;font-weight:800;color:var(--sub)}
.phones{display:flex;flex-wrap:wrap;gap:30px 26px;align-items:flex-start}
.pc{width:300px}
.pc .cap{margin-top:12px}
.pc .cap>b{display:block;font-size:14.5px;font-weight:900}
.pc .cap>span{display:block;font-size:12.5px;font-weight:700;color:var(--sub);line-height:1.55;margin-top:3px}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font:800 11px var(--fd);margin-right:6px;vertical-align:1px}

/* 폰 */
.ph{width:300px;height:620px;background:var(--cream);border:2.5px solid var(--ink);border-radius:42px;box-shadow:5px 6px 0 var(--ink);overflow:hidden;position:relative;display:flex;flex-direction:column}
.ph.dark{background:var(--ink)}
.sbar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0;font:800 12px var(--fd)}
.sbar i{width:16px;height:9px;border:1.5px solid currentColor;border-radius:3px;display:inline-block;position:relative}.sbar i:after{content:"";position:absolute;inset:1px;right:4px;background:currentColor;border-radius:1px}
.ph.dark .sbar{color:#fff}
.demo{flex:none;height:22px;background:var(--ink);color:var(--yellow);font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.2px}
.demo:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--yellow)}
.scr{flex:1;overflow:hidden;padding:8px 14px 96px;position:relative}
.scr.np{padding-bottom:14px}
/* 탭 바 */
.tb{position:absolute;left:12px;right:12px;bottom:14px;height:58px;background:#fff;border:2px solid var(--ink);border-radius:29px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;box-shadow:2px 3px 0 var(--ink);z-index:5}
.tb span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:800;color:#9B93A6;position:relative;width:48px;padding:5px 0;border-radius:18px}
.tb span.on{color:var(--ink);background:var(--yellow)}
.tb span.ops{color:var(--ink)}
.tb span.ops.on{background:var(--yellow)}
.tb span em{position:absolute;top:-2px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--deep);color:#fff;border:1.5px solid var(--ink);font:800 9px var(--fd);font-style:normal;display:grid;place-items:center}
/* 공통 조각 */
.hd{display:flex;align-items:center;gap:8px;height:42px;margin:0 0 6px}
.hd .bk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.hd b{flex:1;font-size:16px;font-weight:900}
.hd .act{height:30px;padding:0 12px;border-radius:15px;border:2px solid var(--ink);background:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;gap:5px}
.hd .act.ink{background:var(--ink);color:#fff}
.ttl{font-size:21px;font-weight:900;letter-spacing:-.4px;margin:6px 0 2px}
.sm{font-size:11.5px;font-weight:800;color:var(--sub)}
.cd{background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:3px 3px 0 var(--ink);padding:12px 14px}
.sec{font-size:11.5px;font-weight:900;color:var(--sub);margin:14px 2px 7px;display:flex;justify-content:space-between}
.bt{height:46px;border-radius:23px;border:2.5px solid var(--ink);border-bottom-width:5px;background:var(--ink);color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}
.bt.y{background:var(--yellow);color:var(--ink)}
.bt.w{background:#fff;color:var(--ink)}
.bt.sm2{height:36px;font-size:12.5px;border-bottom-width:4px;border-radius:18px}
.bt.red{background:#fff;color:var(--red);border-color:var(--red)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:13.5px;font-weight:900}
.row .tx small{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ri{width:30px;height:30px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.cnt{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--deep);color:#fff;border:1.5px solid var(--ink);font:800 10px var(--fd);display:grid;place-items:center}
.cnt.z{background:#F0EBDF;color:#B3AA98;border-color:#D6CDBA}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:10.5px;font-weight:900;border:1.5px solid var(--ink);background:#fff;white-space:nowrap}
.chip.ok{background:#DDF3E6;border-color:var(--green);color:var(--green)}
.chip.qr{background:var(--lav);border-color:var(--purple);color:var(--purple)}
.chip.no{background:#F3EEE2;border-color:#CFC6B2;color:#8D8574}
.chip.ink{background:var(--ink);color:#fff}
.chip.y{background:var(--yellow)}
.tag{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:8px;font:800 8.5px var(--fd);letter-spacing:.3px;margin-left:5px;vertical-align:2px}
.t-pro{background:var(--purple);color:#fff}.t-staff{background:var(--ink);color:var(--yellow)}
.t-host{background:var(--yellow);color:var(--ink);border:1.5px solid var(--ink)}.t-co{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.avw{position:relative;flex:none;display:inline-block}
.av{width:100%;height:100%;border-radius:50%;border:2px solid var(--ink);overflow:hidden;display:grid;place-items:center;background:#fff}
.av img{width:80%;max-width:none;margin-top:6%}
.em{position:absolute;right:-4px;bottom:-3px;width:17px;height:17px;border-radius:50%;border:1.8px solid var(--ink);display:grid;place-items:center}
.em svg{width:9px;height:9px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;padding:10px 16px;border-radius:20px;white-space:nowrap;z-index:8;box-shadow:0 6px 18px rgba(30,26,43,.25);display:flex;align-items:center;gap:7px}
.toast i{width:7px;height:7px;border-radius:50%;background:var(--yellow)}
.dim{position:absolute;inset:0;background:rgba(30,26,43,.45);z-index:6}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-top:2.5px solid var(--ink);border-radius:28px 28px 0 0;z-index:7;padding:10px 16px 22px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#CFC6B2;margin:0 auto 10px}
.sheet h3{margin:0 0 2px;font-size:16px;font-weight:900}
.mi{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13.5px;font-weight:800;border-bottom:1.5px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi .ic{width:28px;height:28px;border-radius:9px;background:#fff;border:1.8px solid var(--ink);display:grid;place-items:center;flex:none}
.mi .tx{flex:1}.mi small{display:block;font-size:10.5px;font-weight:700;color:var(--sub)}
.mi.danger{color:var(--red)}.mi.danger .ic{border-color:var(--red)}
.grp{font-size:10.5px;font-weight:900;color:var(--sub);margin:10px 0 0;letter-spacing:.3px}
.off{margin-top:10px;background:#F3EEE2;border:1.5px dashed #CFC6B2;border-radius:14px;padding:9px 12px}
.off b{font-size:11.5px;font-weight:900;color:var(--sub);display:flex;align-items:center;gap:5px}
.off p{margin:4px 0 0;font-size:11.5px;font-weight:700;color:#8D8574;line-height:1.55}
/* 클래퍼보드 카드 (회원 홈 출석 카드와 같은 모양) */
.clap{position:relative;margin-top:14px}
.clap .arm{height:28px;border:2.5px solid var(--ink);border-radius:9px 9px 4px 4px;background:repeating-linear-gradient(-55deg,var(--ink) 0 18px,var(--cream) 18px 36px);transform:rotate(-4deg);transform-origin:left bottom;margin-bottom:-2px}
.clap .body{border:2.5px solid var(--ink);border-radius:6px 6px 24px 24px;overflow:hidden;box-shadow:4px 4px 0 var(--ink)}
.clap .fields{display:flex;background:var(--cream);border-bottom:2px solid var(--ink)}
.clap .fields div{flex:1;padding:7px 10px;border-right:2px solid var(--ink)}.clap .fields div:last-child{border-right:0}
.clap .fields small{display:block;font:800 8.5px var(--fd);color:var(--sub);letter-spacing:.4px}
.clap .fields b{display:block;font:800 15px var(--fd);color:var(--purple);margin-top:2px}
.clap .act{padding:12px 14px 14px}
.clap .act .big{font:800 20px var(--fd);letter-spacing:-.5px}
.clap .act .info{font-size:12px;font-weight:800;margin:3px 0 11px}
.cbtn{height:50px;border-radius:27px;border:2.5px solid var(--ink);border-bottom-width:6px;background:var(--cream);display:flex;align-items:center;gap:10px;padding:0 16px 0 6px;font-size:14.5px;font-weight:900}
.cbtn .q{width:36px;height:36px;border-radius:50%;background:var(--purple);display:grid;place-items:center}
.lang{display:inline-grid;place-items:center;height:18px;padding:0 6px;border-radius:6px;color:#fff;font:800 9px var(--fd);margin-right:5px;vertical-align:1px}
.lang.en{background:var(--en)}.lang.ja{background:var(--ja)}
.dots{display:flex;justify-content:center;gap:5px;margin-top:12px}.dots i{width:6px;height:6px;border-radius:3px;background:#CFC6B2}.dots i.on{width:16px;background:var(--ink)}
/* 노트 */
.ntag{display:inline-flex;height:20px;align-items:center;padding:0 7px;border-radius:6px;font-size:10px;font-weight:900;color:#fff;margin-right:6px;flex:none}
.n-ex{background:var(--purple)}.n-fix{background:var(--deep)}.n-mean{background:var(--en)}.n-q{background:#E08A1E}
.nitem{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:9px 11px;margin-bottom:8px}
.nitem .h{display:flex;align-items:center}
.nitem p{margin:5px 0 0;font-size:12.5px;font-weight:800;line-height:1.45}
.nitem p s{color:#A79F8E;text-decoration-thickness:2px}
.nitem small{font-size:10.5px;font-weight:700;color:var(--sub)}
.to{margin-left:auto;font-size:10px;font-weight:900;color:var(--deep);background:#FBE5EC;border-radius:8px;padding:2px 7px}
.inbar{position:absolute;left:12px;right:12px;bottom:66px;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:7px 8px 7px 10px;display:flex;align-items:center;gap:6px;z-index:4}
.inbar .ph2{flex:1;font-size:12px;font-weight:700;color:#A79F8E}
.inbar .snd{width:30px;height:30px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.done{position:absolute;left:12px;right:12px;bottom:14px;z-index:4}
.banner{background:#DDF3E6;border:2px solid var(--green);color:#1C6B47;border-radius:14px;padding:8px 11px;font-size:12px;font-weight:900;display:flex;align-items:center;gap:7px;margin-bottom:8px}
/* 타일 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:8px 9px;min-height:52px;gap:8px;display:flex;align-items:center;box-shadow:2px 2px 0 var(--ink);position:relative;line-height:1.25}
.tile b{font-size:13px;font-weight:900}
.tile small{font-size:10.5px;font-weight:800;color:var(--sub)}
.tile .ti{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;border:1.8px solid var(--ink)}
.tile .cnt{position:absolute;top:-7px;right:-6px}
.tight .row{padding:7px 0}.tight .row .ri{width:28px;height:28px}
.duo{display:flex;gap:8px;margin-top:10px}.duo .bt{flex:1;height:40px;font-size:12px;border-bottom-width:4px;border-radius:20px;gap:6px}
.bar{height:7px;border-radius:4px;background:#EFE8DA;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--purple);border-radius:4px}
.poster{height:150px;margin:-8px -14px 0;background:var(--en);border-bottom:2.5px solid var(--ink);position:relative;padding:44px 18px 0;color:#fff;overflow:hidden}
.poster:after{content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,226,0,.9);border:2.5px solid var(--ink)}
.poster b{font-size:22px;font-weight:900;display:block;position:relative;z-index:1;line-height:1.2}
.poster small{font-size:11.5px;font-weight:800;opacity:.9;position:relative;z-index:1}
.poster .tools{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.poster .tools span{height:32px;min-width:32px;border-radius:16px;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;color:var(--ink)}
.poster .tools .mg{padding:0 12px;display:flex;gap:5px;align-items:center;font-size:12px;font-weight:900;background:var(--ink);color:#fff}
.info{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1.5px solid var(--line);font-size:12.5px;font-weight:800}
.info:last-child{border:0}
.info .k{color:var(--sub);width:54px;flex:none;font-size:11.5px}
.faces{display:flex}.faces .avw{margin-left:-7px}.faces .avw:first-child{margin-left:0}
.alert{background:var(--yellow);border:2px solid var(--ink);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:900;box-shadow:2px 2px 0 var(--ink)}
.alert .tx{flex:1}.alert small{display:block;font-size:10.5px;font-weight:800;color:#5B4E00}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink);display:grid;place-items:center;background:#fff;flex:none}
.ck.on{background:var(--ink)}
.seg{display:flex;background:#EFE8DA;border-radius:14px;padding:3px;gap:3px;margin-bottom:10px}
.seg span{flex:1;text-align:center;height:30px;line-height:30px;border-radius:11px;font-size:12px;font-weight:900;color:var(--sub)}
.seg span.on{background:#fff;color:var(--ink);border:1.5px solid var(--ink);line-height:27px}
.field{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:9px 12px;margin-bottom:9px}
.field small{display:block;font-size:10.5px;font-weight:900;color:var(--sub)}
.field p{margin:3px 0 0;font-size:13px;font-weight:800;line-height:1.5}
.tg{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;font-size:12.5px;font-weight:800}
.sw{width:38px;height:22px;border-radius:11px;background:#D6CDBA;border:2px solid var(--ink);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid var(--ink)}
.sw.on{background:var(--green)}.sw.on:after{left:17px}
.yn{display:flex;gap:5px}.yn span{height:28px;padding:0 10px;border-radius:14px;border:1.8px solid var(--ink);font-size:11.5px;font-weight:900;display:grid;place-items:center;background:#fff}
.yn span.on{background:var(--ink);color:#fff}
.yn span.x{border-color:#CFC6B2;color:#A79F8E}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px solid var(--line)}
.mrow.dis{opacity:.42}
.mrow .tx{flex:1}.mrow b{font-size:13.5px;font-weight:900;display:block}.mrow small{font-size:10.5px;font-weight:700;color:var(--sub)}
.qrbox{background:#fff;border-radius:26px;padding:18px;margin:16px auto 0;width:236px;border:3px solid var(--yellow)}
.qrbox svg{display:block;width:100%;height:auto}
.ring{height:8px;border-radius:4px;background:#3A3348;overflow:hidden;margin:16px 6px 0}.ring i{display:block;height:100%;width:62%;background:var(--yellow)}
.mini{font-size:10.5px;font-weight:800;color:var(--sub)}
.note{font-size:11px;font-weight:700;color:var(--sub);line-height:1.5;margin-top:10px;display:flex;gap:6px}
.ph.long{height:auto;min-height:620px}.ph.long .scr{overflow:visible}
.chg{position:relative;outline:2.5px dashed var(--deep);outline-offset:4px;border-radius:18px;margin:18px 0 8px}
.chg:before{content:attr(data-l);position:absolute;top:-15px;right:4px;z-index:3;background:var(--deep);color:#fff;font-size:9.5px;font-weight:900;padding:1px 7px;border-radius:8px;border:1.5px solid var(--ink);white-space:nowrap}
.hero{background:#fff;border:2px solid var(--ink);border-radius:22px;box-shadow:3px 3px 0 var(--ink);padding:12px 14px}
.hero .top{display:flex;gap:12px;align-items:center}
.spk{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 7px 0 5px;border-radius:9px;background:var(--ink);color:var(--yellow);font:800 9.5px var(--fd)}
.hero .nm{font-size:17px;font-weight:900;margin-top:3px}
.hero .sub{font-size:11px;font-weight:800;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.hero .bio{font-size:12px;font-weight:700;margin-top:9px}
.hero .fol{display:flex;gap:14px;margin-top:5px;font-size:11px;font-weight:800;color:var(--sub)}.hero .fol b{color:var(--ink);font-family:var(--fd);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:2px solid var(--ink);border-radius:18px;margin-top:12px;padding:9px 0;text-align:center}
.chg .stats,.chg .hero,.chg>.cd{margin-top:0}
.stats div+div{border-left:1.5px solid var(--line)}
.stats b{display:block;font:800 13.5px var(--fd);color:var(--purple)}
.stats small{font-size:9.5px;font-weight:800;color:var(--sub);white-space:nowrap}
.ch2{font-size:14px;font-weight:900}
.kv{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;padding:2px 0}.kv span{color:var(--sub)}
.team{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;margin-top:9px;background:var(--cream);border-radius:10px;padding:6px 9px}.team span{color:var(--sub)}.team .lang{color:#fff;margin:0}
.lrow{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1.5px solid var(--line);font-size:12.5px;font-weight:800}.lrow:last-child{border-bottom:0}
.lrow .v{margin-left:auto;color:var(--sub);font-size:11px}

  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9); if (inF) continue;
    if (x >= 10 && x <= 14 && y >= 10 && y <= 14) continue;
    if (r() > .52) out += `<rect x="${x}" y="${y}" width="1" height="1" fill="#1E1A2B"/>`;
  }
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges">${out}${fin(0, 0)}${fin(n - 7, 0)}${fin(0, n - 7)}<rect x="10" y="10" width="5" height="5" rx="1.2" fill="#493087"/></svg>`;
