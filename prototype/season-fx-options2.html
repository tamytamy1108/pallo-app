<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>계절 장식 시안 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
:root { --ink: #1E1A2B; --cream: #FBF6EA; --sub: #6F6880; }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: #E9E2D2; font-family: 'Noto Sans KR', sans-serif; color: var(--ink); }
.grid { display: grid; grid-template-columns: 148px repeat(4, 196px); gap: 12px; }
.hd { font-weight: 900; font-size: 15px; text-align: center; align-self: end; }
.rl { display: flex; flex-direction: column; justify-content: center; } .rl b { font-family: 'Unbounded', sans-serif; font-size: 20px; } .rl span { font-size: 12.5px; font-weight: 700; color: var(--sub); line-height: 1.45; margin-top: 4px; }
.pn { position: relative; height: 236px; border-radius: 22px; border: 2.5px solid var(--ink); overflow: hidden; background: #FFFDF7 radial-gradient(#E9E2D2 1.3px, transparent 1.4px) 0 0 / 18px 18px; }
.pn .node { position: absolute; left: 50%; top: 52%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 2.5px solid var(--ink); background: radial-gradient(circle at 40% 35%, #FFF6B0, #FFE200 60%, #E8C400); box-shadow: 0 5px 0 var(--ink); font-family: 'Unbounded'; font-weight: 800; font-size: 22px; display: grid; place-items: center; z-index: 2; }
.p { position: absolute; top: 0; left: var(--x); width: var(--s); height: var(--s); animation: fall var(--d) linear infinite; animation-delay: var(--dl); z-index: 1; }
.p .w { display: block; width: 100%; height: 100%; animation: sway var(--sw) ease-in-out infinite alternate; }
.p svg { display: block; width: 100%; height: 100%; overflow: visible; }
@keyframes fall { from { transform: translate(0, -40px); } to { transform: translate(var(--dx, 0px), 280px); } }
@keyframes sway { from { transform: translateX(-12px) rotate(-30deg); } to { transform: translateX(12px) rotate(40deg); } }
@keyframes flip { 0% { transform: translateX(-12px) rotate(-20deg) rotateY(0); } 50% { transform: translateX(2px) rotate(10deg) rotateY(90deg); } 100% { transform: translateX(14px) rotate(40deg) rotateY(180deg); } }
@keyframes spin { from { transform: translateX(-10px) rotate(0) rotateX(0); } to { transform: translateX(10px) rotate(200deg) rotateX(70deg); } }
.p.flip { perspective: 200px; } .p.flip .w { animation-name: flip; }
.p.conf { perspective: 160px; } .p.conf .w { animation-name: spin; animation-timing-function: linear; }
/* E 종이 컷아웃: 흰 종이 가장자리 + 부드러운 그림자 */
.E .p svg { filter: drop-shadow(0 3px 2px rgba(80,60,30,.22)); }
/* F 말랑 3D: 광택 하이라이트 + 바닥 그림자 */
.F .p svg { filter: drop-shadow(0 4px 3px rgba(30,26,43,.2)); }
/* G 리소 라인: 잉크 선 + 살짝 어긋난 색면 */
@media (prefers-reduced-motion: reduce) { .p, .p .w { animation: none !important; } }
</style></head><body>
<div class="grid" id="g"></div>
<script>
const INK = '#1E1A2B';
const SYMBOL = 'M374.44,140.26h-62.65l40.05-59.4c16.01-23.75,9.74-55.98-14.01-71.99h0c-23.75-16.01-55.98-9.74-71.99,14.01l-54.77,81.24-42.86-63.57c-16.01-23.75-48.24-30.02-71.99-14.01h0c-23.75,16.01-30.02,48.24-14.01,71.99l28.13,41.73h-58.47c-28.64,0-51.86,23.22-51.86,51.86h0c0,28.64,23.22,51.86,51.86,51.86h64.91s-35.8,53.1-35.8,53.1c-16.01,23.75-9.74,55.98,14.01,71.99h0c23.75,16.01,55.98,9.74,71.99-14.01l44.08-65.39,36.42,54.03c16.01,23.75,48.24,30.02,71.99,14.01h0c23.75-16.01,30.02-48.24,14.01-71.99l-28.13-41.73h69.09c28.64,0,51.86-23.22,51.86-51.86h0c0-28.64-23.22-51.86-51.86-51.86Z';
const R = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
let U = 0; const uid = () => 'u' + (U++);
const PETAL = 'M12 5 L10.4 2 C5.6 4.4 3.4 11 6.8 17.6 C9 21.8 15 21.8 17.2 17.6 C20.6 11 18.4 4.4 13.6 2 Z';
const LEAF = 'M12 1.5 C19 6 20.5 15 12 22.5 C3.5 15 5 6 12 1.5 Z';
const MAPLE = 'M12 1.2l1.6 3.8 2.3-1.3-.45 4.15 3.6-1.85-.8 3.05 3.8.15-2.75 2.9 1.45 1.2-4.3 2.3.85 2.2-4.6-.9-.3 5.3h-.8l-.3-5.3-4.6.9.85-2.2-4.3-2.3 1.45-1.2-2.75-2.9 3.8-.15-.8-3.05 3.6 1.85-.45-4.15 2.3 1.3z';
const GINKGO = 'M12 14 C4 13.5 1.5 7 4.5 3 C7.5 5 10 4.2 12 2.2 C14 4.2 16.5 5 19.5 3 C22.5 7 20 13.5 12 14 Z';
const FLAKE = [0, 60, 120].map((r) => `<g transform="rotate(${r} 12 12)"><path d="M12 2 V22 M12 5.5 L9.5 3.3 M12 5.5 L14.5 3.3 M12 18.5 L9.5 20.7 M12 18.5 L14.5 20.7"/></g>`).join('');
const BLOSSOM = [0, 72, 144, 216, 288].map((r) => `<ellipse cx="12" cy="6.6" rx="3.5" ry="4.9" transform="rotate(${r} 12 12)"/>`).join('');
// E 종이 컷아웃: 단색 + 흰 종이 테두리
const paper = (d, c, inner = '') => `<svg viewBox="0 0 24 24"><path d="${d}" fill="${c}" stroke="#FFFDF7" stroke-width="1.6" stroke-linejoin="round"/>${inner}</svg>`;
const paperG = (g, c) => `<svg viewBox="0 0 24 24"><g fill="${c}" stroke="#FFFDF7" stroke-width="1.4">${g}</g><circle cx="12" cy="12" r="2.3" fill="#FFE27A" stroke="#FFFDF7" stroke-width="1"/></svg>`;
const paperFlake = (c) => `<svg viewBox="0 0 24 24"><g stroke="#FFFDF7" stroke-width="4.2" stroke-linecap="round" fill="none">${FLAKE}</g><g stroke="${c}" stroke-width="2.2" stroke-linecap="round" fill="none">${FLAKE}</g></svg>`;
// F 말랑 3D: 그라데이션 볼륨 + 하이라이트
const soft = (d, c1, c2, vb = 24) => { const i = uid(); return `<svg viewBox="0 0 24 24"><defs><radialGradient id="${i}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".25" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient></defs><path d="${d}" fill="url(#${i})"/><ellipse cx="9" cy="7.5" rx="2" ry="1.1" transform="rotate(-30 9 7.5)" fill="#fff" opacity=".75"/></svg>`; };
const softBall = (c1, c2) => { const i = uid(); return `<svg viewBox="0 0 24 24"><defs><radialGradient id="${i}" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient></defs><circle cx="12" cy="12" r="10" fill="url(#${i})"/><ellipse cx="8.5" cy="7.5" rx="2.6" ry="1.5" transform="rotate(-30 8.5 7.5)" fill="#fff" opacity=".8"/></svg>`; };
const softBlossom = (c1, c2) => { const i = uid(); return `<svg viewBox="0 0 24 24"><defs><radialGradient id="${i}" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient></defs><g fill="url(#${i})">${BLOSSOM}</g><circle cx="12" cy="12" r="2.4" fill="#FFD84A"/><circle cx="11.3" cy="11.3" r=".8" fill="#fff"/></svg>`; };
// G 리소 라인: 색면이 살짝 어긋나고 잉크 선
const riso = (d, c) => `<svg viewBox="0 0 24 24"><path d="${d}" fill="${c}" transform="translate(1.6 1.4)"/><path d="${d}" fill="none" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
const risoG = (g, c) => `<svg viewBox="0 0 24 24"><g fill="${c}" transform="translate(1.6 1.4)">${g}</g><g fill="none" stroke="${INK}" stroke-width="1.1">${g}</g><circle cx="12" cy="12" r="1.8" fill="#FFE200" stroke="${INK}" stroke-width="1"/></svg>`;
const risoFlake = (c) => `<svg viewBox="0 0 24 24"><g stroke="${c}" stroke-width="3" stroke-linecap="round" transform="translate(1.4 1.2)">${FLAKE}</g><g stroke="${INK}" stroke-width="1.3" stroke-linecap="round">${FLAKE}</g></svg>`;
// H PALLO 컨페티: PALLO 심볼 + 계절 조각
const sym = (c) => `<svg viewBox="0 0 426.31 377.94"><path d="${SYMBOL}" fill="${c}"/></svg>`;
const rect = (c) => `<svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5" fill="${c}"/></svg>`;
const dot = (c) => `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="${c}"/></svg>`;
const STY = {
  E: { name: '종이 컷아웃', d: '단색 종이 조각 · 흰 가장자리 · 뒤집히며 팔랑', flip: 1,
    spring: () => pick([paper(PETAL, '#F59BB6'), paper(PETAL, '#F8BFD0'), paperG(BLOSSOM, '#F7A9C0')]), summer: () => pick([paper(LEAF, '#7CCB6B', '<path d="M12 4 V20" stroke="#FFFDF7" stroke-width="1"/>'), paper(LEAF, '#A9DC74', '<path d="M12 4 V20" stroke="#FFFDF7" stroke-width="1"/>')]),
    autumn: () => pick([paper(MAPLE, '#EF7B3C'), paper(MAPLE, '#E0503F'), paper(GINKGO, '#F3BC2E')]), winter: () => pick([paperFlake('#8FBFEA'), paperFlake('#B7D5F2')]) },
  F: { name: '말랑 3D', d: '3D 맵처럼 통통한 볼륨 · 광택 · 그림자', flip: 1,
    spring: () => pick([softBlossom('#FFB3CA', '#E9799C'), soft(PETAL, '#FFB3CA', '#E9799C')]), summer: () => pick([soft(LEAF, '#9FE07F', '#4FA94F'), softBall('#C9F07A', '#7CC34A')]),
    autumn: () => pick([soft(MAPLE, '#FF9A55', '#D2552A'), soft(MAPLE, '#FF7466', '#C23A30'), soft(GINKGO, '#FFD45A', '#D9A21A')]), winter: () => pick([softBall('#E6F2FF', '#9CC4EC'), softBall('#F4F9FF', '#B5D3F0')]) },
  G: { name: '리소 라인', d: 'PALLO 잉크 선 · 색면이 살짝 어긋난 인쇄 느낌', flip: 0,
    spring: () => pick([riso(PETAL, '#FFB8CC'), risoG(BLOSSOM, '#FFC9D8')]), summer: () => pick([riso(LEAF, '#B5E58F'), riso(LEAF, '#8FD7A8')]),
    autumn: () => pick([riso(MAPLE, '#FF9B5C'), riso(MAPLE, '#FF7A6B'), riso(GINKGO, '#FFD35C')]), winter: () => pick([risoFlake('#BFDCF5'), risoFlake('#D8E9FA')]) },
  H: { name: 'PALLO 컨페티', d: 'PALLO 심볼 + 계절 조각 · 빙글빙글 축제처럼', conf: 1,
    spring: () => pick([sym('#F7A9C0'), sym('#FFE200'), rect('#FBD0DC'), paperG(BLOSSOM, '#F7B6C9')]), summer: () => pick([sym('#8FD07A'), sym('#FFE200'), rect('#BDE8A0'), dot('#7FD3E8')]),
    autumn: () => pick([sym('#F08A4B'), sym('#FFE200'), rect('#F6C35A'), paper(MAPLE, '#E0603F')]), winter: () => pick([sym('#9CC7EE'), sym('#FFE200'), rect('#D4E6F8'), dot('#FFFFFF')]) }
};
const SEA = [['spring', '봄'], ['summer', '여름'], ['autumn', '가을'], ['winter', '겨울']];
const g = document.getElementById('g');
g.innerHTML = '<div></div>' + SEA.map(([, n]) => `<div class="hd">${n}</div>`).join('');
Object.entries(STY).forEach(([k, st]) => {
  g.insertAdjacentHTML('beforeend', `<div class="rl"><b>${k}</b><b style="font-family:'Noto Sans KR';font-size:15px">${st.name}</b><span>${st.d}</span></div>`);
  SEA.forEach(([se]) => {
    let h = `<div class="pn ${k}"><span class="node">1</span>`;
    for (let i = 0; i < 16; i++) {
      const s = k === 'H' ? R(18, 28) : R(18, 28), d = k === 'H' ? R(6, 10) : R(8, 13);
      const cls = 'p' + (st.flip && (se === 'autumn' || se === 'summer' || k === 'E') ? ' flip' : '') + (st.conf ? ' conf' : '');
      h += `<span class="${cls}" style="--x:${R(2, 90)}%;--s:${s}px;--d:${d}s;--dl:-${R(0, d)}s;--dx:${R(-24, 24)}px;--sw:${R(1.6, 3)}s"><span class="w">${st[se]()}</span></span>`;
    }
    g.insertAdjacentHTML('beforeend', h + '</div>');
  });
});
</script>
</body></html>
