<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>꾸미기 PNG 뽑기</title></head>
<body style="font:13px system-ui">
<p id="st">준비 중…</p>
<script src="art.js"></script>
<script>
// art.js 그림을 PNG 로 떠서 serve.js 로 보내요 → mobile/assets/characters/av/ · geo.json
const A = window.AVART, S = 1.5, BS = 3;   // 캐릭터 좌표 1 = 1.5px · 무대(배경 · 효과) 1 = 3px
const [VX, VY, VW, VH] = A.V.split(' ').map(Number);
const st = (t) => (document.getElementById('st').textContent = t);
const dataUrl = async (u) => { const b = await (await fetch(u)).blob(); return await new Promise((r) => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); };
async function raster(svg, w, h) {
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
  return x.getImageData(0, 0, w, h);
}
function bbox(...ds) {
  const { width: w, height: h } = ds[0]; let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (const d of ds) for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d.data[(y * w + x) * 4 + 3] > 2) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  x0 = Math.max(0, x0 - 2); y0 = Math.max(0, y0 - 2); x1 = Math.min(w - 1, x1 + 2); y1 = Math.min(h - 1, y1 + 2);
  return [x0, y0, x1 - x0 + 1, y1 - y0 + 1];
}
async function save(name, d, b) {
  const c = document.createElement('canvas'); c.width = b[2]; c.height = b[3];
  c.getContext('2d').putImageData(d, -b[0], -b[1], b[0], b[1], b[2], b[3]);
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
  await fetch('/save/' + name, { method: 'POST', body: blob });
}
const r4 = (n) => Math.round(n * 10000) / 10000;
const charR = (b) => [r4((b[0] / S + VX) / 520), r4((b[1] / S + VY) / 332), r4(b[2] / S / 520), r4(b[3] / S / 332)];
// 머리 색 칠하기: H=검정 · 흰색 두 번 그려 바탕(빛 · 그림자 · 선)과 색칠 자리(알파 t)로 나눠요. 앱: 바탕 위에 tintColor 로 칠한 자리
function split(d0, d1) {
  const n = d0.data.length, base = new ImageData(d0.width, d0.height), fill = new ImageData(d0.width, d0.height);
  for (let i = 0; i < n; i += 4) {
    const A0 = d0.data[i + 3] / 255; if (!A0) continue;
    const p0 = [0, 1, 2].map((k) => (d0.data[i + k] / 255) * A0), p1 = [0, 1, 2].map((k) => (d1.data[i + k] / 255) * (d1.data[i + 3] / 255));
    let t = Math.max(0, Math.min(A0, (p1[0] - p0[0] + p1[1] - p0[1] + p1[2] - p0[2]) / 3));
    if (t > 0.996) t = 1;
    const aB = t >= 1 ? 0 : (A0 - t) / (1 - t);
    for (let k = 0; k < 3; k++) base.data[i + k] = aB > 0 ? Math.min(255, Math.round((p0[k] / (A0 - t || 1)) * 255)) : 0;
    base.data[i + 3] = Math.round(aB * 255);
    fill.data[i] = fill.data[i + 1] = fill.data[i + 2] = 255; fill.data[i + 3] = Math.round(t * 255);
  }
  return [base, fill];
}
(async () => {
  A.IMG.mask = await dataUrl('body-mask.png'); A.IMG.shade = await dataUrl('up-yellow.png');
  const geo = { items: {}, bgs: {} };
  const W = VW * S, H = VH * S, only = new URLSearchParams(location.search).get('only');
  for (const it of A.ITEMS) {
    if (only && !it.id.startsWith(only)) { if (it.hair) geo.items[it.id] = null; continue; }
    st('그리는 중 ' + it.id);
    if (it.hair) {
      const g = { k: 'box', hair: true };
      for (const part of ['back', 'front', 'cap', 'side']) {
        if (!it[part]) continue;
        const d0 = await raster(A.svg(it[part]('#000000')), W, H), d1 = await raster(A.svg(it[part]('#FFFFFF')), W, H);
        const b = bbox(d0); if (!b) continue; const [base, fill] = split(d0, d1);
        const nm = it.id + (part === 'back' ? '' : '-' + part);
        await save(nm + '.png', base, b); await save(nm + '-fill.png', fill, b);
        g[part] = charR(b);
      }
      geo.items[it.id] = g; continue;
    }
    if (!it.art) { geo.items[it.id] = { k: 'none' }; continue; }
    if (it.layer === 'fx') {
      const d = await raster(A.svg(it.art(), '0 0 300 220'), 300 * BS, 220 * BS), b = bbox(d);
      await save(it.id + '.png', d, b);
      geo.items[it.id] = { k: 'stage', r: [r4(b[0] / BS / 300), r4(b[1] / BS / 220), r4(b[2] / BS / 300), r4(b[3] / BS / 220)] };
      continue;
    }
    const d = await raster(A.svg(it.art()), W, H), b = bbox(d);
    await save(it.id + '.png', d, b);
    geo.items[it.id] = { k: 'box', r: charR(b) };
  }
  if (!only) for (const bg of A.BGS) {
    st('배경 ' + bg.id);
    const d = await raster(A.svg(bg.art(), '0 0 300 220'), 300 * BS, 220 * BS);
    await save('bg-' + bg.id + '.png', d, [0, 0, 300 * BS, 220 * BS]);
  }
  geo.meta = A.ITEMS.map(({ id, cat, name, price, rare, lock, layer, hat, hair, lid, cover, clipY }) => ({ id, cat, name, price, rare, lock, layer, hat, hair, lid, cover, clipY, front: !!(A.ITEMS.find((x) => x.id === id).front) }));
  geo.bgMeta = A.BGS.map(({ id, name, price, rare, lock, face }) => ({ id, name, price, rare, lock, face }));
  if (!only) await fetch('/save/geo.json', { method: 'POST', body: JSON.stringify(geo, null, 1) });
  st('끝 ✓ ' + Object.keys(geo.items).length);
})().catch((e) => st('오류 ' + e.message));
</script></body></html>
